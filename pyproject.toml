[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-piano-evaluation"
version = "0.1.0"
description = "Model-independent, offline piano-animation evaluation methods and synthetic tests"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
piano-eval = "piano_eval.__main__:main"

[tool.setuptools.packages.find]
include = ["piano_eval*"]
