name: Offline evaluation tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . 'numpy==2.0.2'
      - run: python -m unittest discover -s tests -v
      - run: |
          python examples/generate_synthetic.py .demo
          piano-eval evaluate --prediction .demo/identical.npz --reference .demo/reference.npz --metadata .demo/metadata.json --output .demo/identical-report.json
          piano-eval evaluate --prediction .demo/floating.npz --reference .demo/reference.npz --metadata .demo/metadata.json --output .demo/floating-report.json
          piano-eval check-splits examples/splits.synthetic.json --hold-out-performers --output .demo/split-check.json
